# Hardened Docker Compose example for hackolade/hck-cli.
#
# WRITABLE PATHS: /data and /tmp ONLY — the image writes runtime data nowhere else.
#   /data  persistent volume — license (/data/app), logs, models, output, settings
#   /tmp   tmpfs — sockets, caches, scratch
# read_only: true enforces this: any write outside /data or /tmp fails.
# Do not mount legacy /home/hackolade/.config or /home/hackolade/Documents/* paths.
#
# Security profile (CI, production, Kubernetes Restricted parity):
#   - read-only root filesystem
#   - all capabilities dropped, no privilege escalation
#   - non-root user (1000:1001 by default)
#
# Usage:
#   docker compose -f compose.hardened.yml run --rm hck-cli
#   (--rm removes the one-off container; omitting it leaves orphan …-run-… containers)
#   Default command is version — lists Studio release and installed plugins
#
# For the same /data + /tmp layout without read-only rootfs, use compose.yml.
# For Kubernetes manifests with a PVC, see k8s/hck-cli-job.yaml.
# Documentation: doc/getting-started-hck-cli.md

services:
  hck-cli: &hck-cli
    init: true
    image: hackolade/hck-cli:8.12.7
    command: ["version"]
    restart: 'no'
    read_only: true
    user: "1000:1001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - hackolade-studio-data:/data
      - ${PWD}/models:/data/models
    tmpfs:
      - /tmp:rw,size=1g,mode=1777

  showComputerIdForOfflineValidation:
    extends: hck-cli
    # Prints Computer ID + ready-to-open QLM URL for LicenseFile.xml download
    command: ["getComputerId"]

  validateKeyOffline:
    extends: hck-cli
    network_mode: 'none'
    command: ["validateKey"]
    secrets:
      - license_file

  validateKeyOnline:
    extends: hck-cli
    command: ["validateKey"]
    network_mode: host
    secrets:
      - license_key

  # Smoke test: run a command that starts Electron and writes output, not just the CLI wrapper.
  genDoc:
    extends: hck-cli
    command: ["genDoc", "--model=/data/models/smoke.hck.json", "--doc=/data/output/smoke.pdf"]

  # OpenShift restricted-v2 assigns an arbitrary UID in the root supplementary group.
  # Proves nss_wrapper and group-0 ownership of /data work without a passwd entry.
  hck-cli-arbitrary-uid:
    <<: *hck-cli
    user: "31337:0"

  # Trust a private CA with a read-only PEM mount — no root step required.
  # See doc/custom-certificates.md.
  # runWithCustomCertificates:
  #   extends: hck-cli
  #   environment:
  #     NODE_EXTRA_CA_CERTS: /certs/internal-ca.crt
  #     SSL_CERT_FILE: /certs/internal-ca.crt
  #   volumes:
  #     - ./certificates/internal-ca.crt:/certs/internal-ca.crt:ro

volumes:
  hackolade-studio-data:

secrets:
  license_key:
    file: ${HOME}/Downloads/license-key.txt
  license_file:
    file: ${HOME}/Downloads/LicenseFile.xml
