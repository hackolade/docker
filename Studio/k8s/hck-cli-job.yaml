# Hardened Kubernetes Job for hackolade/hck-cli (Restricted Pod Security Standard).
#
# Writable mounts:
#   /data  — PersistentVolumeClaim (license state, logs, models, output)
#   /tmp   — emptyDir backed by memory (tmpfs equivalent, 1 GiB limit)
#
# Apply:
#   kubectl apply -f hck-cli-job.yaml
#   kubectl logs job/hck-cli-version
#
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hck-cli-data
  labels:
    app: hck-cli
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hck-cli-version
  labels:
    app: hck-cli
    pod-security.kubernetes.io/enforce: restricted
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: hck-cli
        pod-security.kubernetes.io/enforce: restricted
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1001
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hck-cli-data
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
      containers:
        - name: hck-cli
          image: hackolade/hck-cli:8.9.2
          args: ["version"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
